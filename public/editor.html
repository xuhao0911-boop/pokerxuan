<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑界面 · PokerXuan</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/editor.css"></head><body>
<header><a href="/" target="_blank" rel="noopener">Poker<span>Xuan</span></a><strong>编辑界面</strong><span id="status" role="status">已加载</span><button id="save" class="primary">保存到我的牌桌</button></header>
<main><section class="workspace"><div class="preview-bar"><div role="group" aria-label="编辑设备"><button data-profile="desktop" class="selected">电脑</button><button data-profile="mobile">手机</button></div><span>点击选中 · 拖动调整位置</span><button id="fit">适合窗口</button></div><div id="canvas"><div id="frameBox"><iframe id="preview" src="/layout-preview.html" title="可编辑的牌桌预览"></iframe></div></div><p class="preview-note">示例牌局 · 保存后切回牌桌即可看到修改</p></section>
<aside><section><h2>选择元素</h2><select id="element" aria-label="选择要编辑的元素"></select><div class="field-grid"><label>横向位置 %<input id="x" type="number" step="0.5" min="-100" max="100"></label><label>纵向位置 %<input id="y" type="number" step="0.5" min="-100" max="100"></label></div><label class="range-label">大小 <output id="scaleValue"></output><input id="scale" type="range" min="35" max="200" step="1"></label><label>字号 <span class="muted">0 为默认</span><input id="fontSize" type="number" min="0" max="42" step="1"></label><button id="resetElement" class="secondary">还原这个元素</button></section>
<section><h2>配色与字体</h2><div id="colors" class="colors"></div><label>字体<select id="font"><option value="system">系统字体</option><option value="hei">微软雅黑</option><option value="arial">Arial</option></select></label></section>
<section><h2>我的配置</h2><div class="file-actions"><button id="export">导出</button><button id="importBtn">导入</button><input id="import" type="file" accept=".json,application/json" hidden></div><button id="reset" class="secondary">全部还原</button><p class="muted">仅保存在本浏览器。电脑、手机布局分别调整；配色和字体共用。导出后可在另一台设备导入。</p></section></aside></main>
<script src="/layout-defaults.js"></script><script src="/layout-config.js"></script><script src="/editor.js"></script></body></html>
